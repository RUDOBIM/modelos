<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajustes</title>
<!-- Franja mínima que AR Quick Look (iPhone) muestra abajo de la RA. Al tocarla, Safari regresa a la
     página de RA y abre los ajustes de escala y elevación. Solo un ícono, sin texto. -->
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  body { display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
  .boton { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.95); color: #0a84ff;
           display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="boton" role="button" aria-label="Escala y elevación">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </div>
</body>
</html>
