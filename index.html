<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Visor · BIM Loading</title>
<style>
  :root { --acento: #0a84ff; --texto: #1c2733; --tenue: #5d6b7c; --borde: #d7dde5; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eef1f5; }
  body { font: 13px/1.35 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: var(--texto);
         -webkit-user-select: none; user-select: none; }
  #lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #etiquetas { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .etiqueta { position: absolute; left: 0; top: 0; padding: 2px 7px; border-radius: 6px; background: var(--acento);
              color: #fff; font-weight: 600; font-size: 12px; white-space: nowrap; }

  #cabecera { position: fixed; left: 14px; top: 12px; display: flex; flex-direction: column; gap: 2px; pointer-events: none; max-width: calc(100vw - 28px);
              padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,.86); }
  .marca { font-weight: 700; letter-spacing: .14em; font-size: 12px; color: #0b1220; }
  .marca span { color: var(--acento); }
  #titulo { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #barra { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 2px; padding: 5px;
           max-width: calc(100vw - 16px); overflow-x: auto; background: #fff; border: 1px solid var(--borde);
           border-radius: 14px; box-shadow: 0 6px 22px rgba(16,24,40,.14); scrollbar-width: none; }
  #barra::-webkit-scrollbar { display: none; }
  #barra button { flex: 0 0 auto; width: 84px; padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 3px;
                  font: inherit; font-size: 11.5px; color: var(--texto); background: transparent; border: 1px solid transparent;
                  border-radius: 10px; cursor: pointer; }
  #barra button:hover { background: #f1f4f8; }
  #barra button.activo { color: var(--acento); border-color: var(--acento); background: #f2f8ff; }
  #barra button:focus-visible, .panel button:focus-visible, .panel input:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }
  #barra svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  @media (max-width: 720px) { #barra { gap: 0; padding: 4px; } #barra button { width: 40px; } #barra button span { display: none; } #barra svg { width: 22px; height: 22px; } }

  .panel { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
           justify-content: center; max-width: calc(100vw - 16px); padding: 8px 12px; background: #fff; border: 1px solid var(--borde);
           border-radius: 12px; box-shadow: 0 6px 22px rgba(16,24,40,.12); }
  @media (max-width: 720px) { .panel { bottom: 76px; } }
  .panel button { font: inherit; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--borde); background: #fff; color: var(--texto); cursor: pointer; }
  .panel button.activo { border-color: var(--acento); color: var(--acento); }
  .panel input[type=range] { width: min(240px, 46vw); accent-color: var(--acento); }
  .panel .nota { color: var(--tenue); }
  .panel.columna { flex-direction: column; align-items: stretch; gap: 8px; }
  .panel .fila { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .panel .nota { text-align: center; }
  .panel select, .panel input[type=text] { font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--borde); background: #fff; color: var(--texto); }
  .panel button.lleno { background: var(--acento); border-color: var(--acento); color: #fff; }
  .panel .config label { display: flex; align-items: center; gap: 6px; }
  .panel .interruptor input { accent-color: var(--acento); width: 16px; height: 16px; }
  .herramientas button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 62px; padding: 5px 4px; font-size: 11.5px; border-color: transparent; }
  .herramientas button:hover { background: #f1f4f8; }
  .herramientas svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .herramientas button.borrar { align-self: center; min-width: 0; padding: 7px 16px; margin-left: 6px; border-color: var(--borde); letter-spacing: .06em; font-size: 11px; color: var(--tenue); }
  @media (max-width: 720px) { .herramientas button { min-width: 40px; } .herramientas button span { display: none; } }
  .lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 3px 12px; max-height: 26vh; overflow: auto; width: min(560px, 86vw); }
  .lista label { display: flex; gap: 6px; align-items: center; cursor: pointer; overflow-wrap: anywhere; }
  .lista input { accent-color: var(--acento); }
  #etiquetas.suprimir .etiqueta { pointer-events: auto; cursor: pointer; background: #b42318; }
  #snap { position: fixed; left: 0; top: 0; width: 14px; height: 14px; pointer-events: none; border: 2px solid var(--acento); background: rgba(255,255,255,.7); }
  #snap.snap-vertice { border-radius: 0; }
  #snap.snap-medio { width: 0; height: 0; background: transparent; border: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid var(--acento); }
  #snap.snap-arista { border-radius: 0; transform-origin: center; clip-path: polygon(20% 0, 50% 30%, 80% 0, 100% 20%, 70% 50%, 100% 80%, 80% 100%, 50% 70%, 20% 100%, 0 80%, 30% 50%, 0 20%); background: var(--acento); border: 0; }
  #snap.snap-cara { border-radius: 50%; width: 10px; height: 10px; }
  #recuadro { position: fixed; pointer-events: none; border: 1.500px dashed var(--acento); background: rgba(10,132,255,.10); }
  #pad { display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(2, 36px); gap: 4px; }
  #pad button { padding: 0; font-size: 16px; touch-action: none; }
  #pad [data-k=av] { grid-column: 2; }
  #pad [data-k=iz] { grid-column: 1; grid-row: 2; } #pad [data-k=at] { grid-column: 2; grid-row: 2; } #pad [data-k=de] { grid-column: 3; grid-row: 2; }

  #carga { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: #eef1f5; }
  #carga > div { width: min(360px, 100%); text-align: center; }
  #carga-texto { margin-bottom: 10px; color: var(--tenue); }
  #carga.error #carga-texto { color: #b42318; }
  .progreso { height: 5px; border-radius: 3px; background: #d7dde5; overflow: hidden; }
  #carga-barra { height: 100%; width: 0; background: var(--acento); transition: width .2s; }
  .progreso.indefinida #carga-barra { width: 35% !important; animation: vaiven 1.2s ease-in-out infinite alternate; }
  @keyframes vaiven { from { margin-left: 0; } to { margin-left: 65%; } }
  @media (prefers-reduced-motion: reduce) { .progreso.indefinida #carga-barra { animation: none; } }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="etiquetas"></div>
<div id="snap" hidden></div>
<div id="recuadro" hidden></div>
<div id="cabecera"><div class="marca">BIM <span>LOADING</span></div><div id="titulo"></div></div>

<div class="panel" id="p-zoom" hidden>
  <button data-zoom="ventana">Ventana</button><button data-zoom="scroll" class="activo">Scroll</button><button data-zoom="seleccion">Selección</button>
  <span class="nota" id="zoom-texto"></span>
</div>

<div class="panel columna" id="p-medir" hidden>
  <div class="fila" id="calibrar" hidden>
    <label for="calibrar-valor">Distancia real</label><input id="calibrar-valor" type="text" inputmode="decimal" size="8"><span id="calibrar-unidad">m</span>
    <button id="calibrar-aplicar" class="lleno">Aplicar</button><button id="calibrar-restablecer">Restablecer</button>
  </div>
  <div class="fila config" id="medir-config" hidden>
    <label>Unidad <select id="cfg-unidad"><option value="m">Metros</option><option value="cm">Centímetros</option><option value="mm">Milímetros</option><option value="ft">Pies</option><option value="in">Pulgadas</option></select></label>
    <label>Precisión <select id="cfg-precision"><option value="0">1</option><option value="1">0.1</option><option value="2" selected>0.01</option><option value="3">0.001</option></select></label>
    <label class="interruptor"><input id="cfg-aislar" type="checkbox"> Aislar medición</label>
    <label class="interruptor"><input id="cfg-libre" type="checkbox"> Medición libre (sin snaps)</label>
  </div>
  <div class="nota" id="medir-texto"></div>
  <div class="fila herramientas">
    <button data-medir="distancia" class="activo"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 8v8M21 8v8M7 10l-3 2 3 2M17 10l3 2-3 2"/></svg><span>Distancia</span></button>
    <button data-medir="angulo"><svg viewBox="0 0 24 24"><path d="M4 20h16M4 20L15 5M12 20a8 8 0 0 0-2.800-6.100"/></svg><span>Ángulo</span></button>
    <button data-medir="calibrar"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M11 7L6 20M13 7l5 13M8.500 14h7"/></svg><span>Calibrar</span></button>
    <button data-medir="coordenadas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg><span>Coordenadas</span></button>
    <button data-medir="laser"><svg viewBox="0 0 24 24"><path d="M4 20L14 10"/><circle cx="16.500" cy="7.500" r="2.500"/><path d="M20 2v2M22 4h-2M21 9.500h1.500M14.500 3V1.500"/></svg><span>Láser</span></button>
    <button data-medir="suprimir"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/></svg><span>Suprimir</span></button>
    <button id="btn-config"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.900 4.900l2.100 2.100M17 17l2.100 2.100M4.900 19.100L7 17M17 7l2.100-2.100"/></svg><span>Configuración</span></button>
    <button id="medir-borrar" class="borrar">BORRAR</button>
  </div>
</div>
<div class="panel" id="p-seccion" hidden>
  <button data-eje="x">X</button><button data-eje="y" class="activo">Altura</button><button data-eje="z">Z</button>
  <input id="sec-pos" type="range" min="0" max="1000" value="500" aria-label="Posición del corte">
  <button id="sec-invertir">Invertir</button><button id="sec-quitar">Quitar corte</button>
</div>
<div class="panel columna" id="p-descomponer" hidden>
  <div class="lista" id="des-lista" hidden></div>
  <div class="fila">
    <input id="des-pos" type="range" min="0" max="100" value="0" aria-label="Separación de las categorías">
    <button id="des-quitar">Restablecer</button>
  </div>
  <div class="nota" id="des-nota">Desliza para separar las categorías.</div>
</div>
<div class="panel" id="p-persona" hidden>
  <div id="pad"><button data-k="av" aria-label="Avanzar">▲</button><button data-k="iz" aria-label="Izquierda">◀</button><button data-k="at" aria-label="Retroceder">▼</button><button data-k="de" aria-label="Derecha">▶</button></div>
  <span class="nota">Arrastra para mirar. Flechas o W A S D para caminar; Mayús para ir más rápido.</span>
</div>

<nav id="barra" hidden aria-label="Herramientas del visor">
  <button data-a="inicio" title="Volver a la vista inicial"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg><span>Inicio</span></button>
  <button data-a="ajustar" title="Ajustar el modelo a la pantalla"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg><span>Ajustar</span></button>
  <button data-h="encuadre" title="Desplazar la vista"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span>Encuadre</span></button>
  <button data-h="zoom" title="Acercar y alejar"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span>Zoom</span></button>
  <button data-h="orbita" class="activo" title="Girar alrededor del modelo"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4"/><path d="M12 3c3 2.5 3 15.500 0 18M12 3c-3 2.500-3 15.500 0 18"/></svg><span>Órbita</span></button>
  <button data-h="persona" title="Recorrer el modelo caminando"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.500" r="2"/><path d="M12 7v7M8 10l4-2 4 2M12 14l-3 7M12 14l3 7"/></svg><span>Primera persona</span></button>
  <button data-h="medir" title="Medir la distancia entre dos puntos"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 8v8M21 8v8M8 10v4M12 10v4M16 10v4"/></svg><span>Medir</span></button>
  <button data-h="seccion" title="Cortar el modelo con un plano"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.500v9L12 21l-8-4.500v-9z"/><path d="M4 12l8 4.500 8-4.500"/></svg><span>Sección</span></button>
  <button data-h="descomponer" title="Separar el modelo en partes"><svg viewBox="0 0 24 24"><path d="M12 2l5 2.800v5.400L12 13 7 10.200V4.800z"/><path d="M5 14l4 2.200v4.300M19 14l-4 2.200v4.300"/></svg><span>Descomponer</span></button>
</nav>

<div id="carga" hidden><div><div id="carga-texto"></div><div class="progreso"><div id="carga-barra"></div></div></div></div>
